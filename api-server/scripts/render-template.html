<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pludo GLB Thumbnailer</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script type="importmap">
{
  "imports": {
    "three":          "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/":  "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE        from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setClearColor(0x1a1a1a, 1);
renderer.outputColorSpace   = THREE.SRGBColorSpace;
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);

// Soft three-point lighting so models read regardless of material shading.
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2, 2.5, 2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xb8d4ff, 0.8);
fill.position.set(-2, 1, 1);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffddc0, 0.6);
rim.position.set(0, 1, -3);
scene.add(rim);

const loader = new GLTFLoader();

// Frames the camera so the loaded model fills ~80% of the viewport regardless
// of its native scale.
function frame(model) {
  const box  = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const ctr  = box.getCenter(new THREE.Vector3());
  model.position.sub(ctr);

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fov    = camera.fov * Math.PI / 180;
  const dist   = (maxDim / 2) / Math.tan(fov / 2) * 1.4;
  // Hero 3/4 angle — front-right + slight overhead.
  camera.position.set(dist * 0.6, dist * 0.55, dist * 0.85);
  camera.lookAt(0, 0, 0);
  camera.near = Math.max(dist / 100, 0.01);
  camera.far  = dist * 100;
  camera.updateProjectionMatrix();
}

// Called by the puppeteer host with the GLB bytes (base64). R2's CDN doesn't
// emit CORS headers and the page is loaded over file://, so an in-browser
// fetch would be blocked — the Node host fetches the bytes and hands them
// to us. Returns a data: URL PNG on resolve, or "ERROR:..." on failure.
window.renderGlbBytes = async function(base64) {
  // Clear any prior model.
  for (let i = scene.children.length - 1; i >= 0; i--) {
    const c = scene.children[i];
    if (c.isLight || c.isCamera) continue;
    scene.remove(c);
  }
  // Decode base64 to ArrayBuffer.
  const binStr = atob(base64);
  const bytes  = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  return new Promise((resolve) => {
    try {
      loader.parse(
        bytes.buffer,
        '', // resourcePath — empty since the GLB is self-contained (.glb embeds textures)
        (gltf) => {
          try {
            const model = gltf.scene;
            scene.add(model);
            frame(model);
            // Render twice — first frame can be wrong because materials/textures
            // are still uploading to the GPU on the previous frame's draw call.
            renderer.render(scene, camera);
            renderer.render(scene, camera);
            const dataUrl = canvas.toDataURL('image/png');
            resolve(dataUrl);
          } catch (e) {
            resolve('ERROR: ' + (e && e.message ? e.message : String(e)));
          }
        },
        (err) => resolve('ERROR: ' + (err && err.message ? err.message : String(err))),
      );
    } catch (e) {
      resolve('ERROR: ' + (e && e.message ? e.message : String(e)));
    }
  });
};

window.rendererReady = true;
</script>
</body>
</html>
